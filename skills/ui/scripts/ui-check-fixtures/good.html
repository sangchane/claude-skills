<!doctype html>
<!-- ui-check 시험용 좋은 견본 — 실패도 경고도 없어야 한다. 늦게 오는 자리는 높이를 미리 잡았다. -->
<html lang="ko"><head><meta charset="utf-8"><title>good</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; color: #18181b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 960px; }
  .card { border: 1px solid #d4d4d8; border-radius: 8px; padding: 16px; min-width: 0; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  .muted { font-size: 12px; color: #52525b; }
  .stat { font-size: 20px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; gap: 8px; }
  button { font: inherit; padding: 6px 12px; background: #e4e4e7; border: 1px solid #a1a1aa; border-radius: 6px; }
  #late { min-height: 120px; }
</style></head>
<body>
  <div class="grid">
    <section class="card">
      <h2>이번 달 사용량</h2>
      <div class="stat">47.2 ㎡</div>
      <p class="muted">기준 50 ㎡ 대비 2.8 ㎡ 여유</p>
    </section>
    <section class="card">
      <h2>도구</h2>
      <div class="row">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="6"/></svg>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"><rect x="2" y="2" width="12" height="12"/></svg>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2 8h12"/></svg>
        <button>변경 저장</button>
      </div>
    </section>
    <section class="card"><h2>최근 기록</h2><div id="late"></div></section>
  </div>
  <script>setTimeout(() => { document.getElementById('late').textContent = '3건 — 모두 정상' }, 300)</script>
</body></html>
